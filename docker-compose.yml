version: '3.0'
services:
  searcharr:
    container_name: searcharr
    hostname: searcharr
    image: harborws/harbortvbot:aiogram
    # Prefer host networking locally; for the "strong" bridge + static IPs
    # use docker-run.sh instead (or define an external network below).
    network_mode: host
    volumes:
      - /opt/searcharr/data:/app/data
      - /opt/searcharr/logs:/app/logs
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
